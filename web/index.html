<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- sRGB equivalent of --color-paper; a meta attribute cannot take a var(). -->
    <meta name="theme-color" content="#060d11" />
    <title>Jellyfin Share</title>

    <!-- The logo set, from web/public/brand. The SVG is the heavier small cut,
         drawn for 16-24px. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/jellyfin-share-mark-small.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/brand/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap"
    />
    <link rel="stylesheet" href="/src/tokens.css" />

    <style>
      /* Boot only. Every value comes through a token — nothing is inlined here. */
      #app { min-height: 100dvh; }

      .boot {
        display: grid;
        place-items: center;
        gap: var(--space-md);
        min-height: 100dvh;
      }
      .boot__meter {
        width: 7.5rem;
        height: 2px;
        background: var(--color-rule);
        overflow: hidden;
      }
      .boot__meter::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--color-accent);
        animation: boot-sweep 1.1s var(--ease-in-out) infinite;
      }
      .boot__label {
        font-family: var(--font-outlier);
        font-size: var(--text-sm);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--color-muted);
      }
      @keyframes boot-sweep {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__meter::after { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot">
        <div class="boot__meter"></div>
        <p class="boot__label">Opening the link</p>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
